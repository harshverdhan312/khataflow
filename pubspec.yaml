name: khata_flow
description: "KhataFlow - Offline-first personal credit ledger with manual settlement recording"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.5.1
  intl: ^0.19.0
  meta: ^1.15.0
  pdf: ^3.11.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/khataflow_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0F17"
  adaptive_icon_foreground: "assets/branding/khataflow_icon.png"

flutter_native_splash:
  color: "#0B0F17"
  image: "assets/branding/khataflow_icon.png"
  color_dark: "#0B0F17"
  image_dark: "assets/branding/khataflow_icon.png"
  android_12:
    color: "#0B0F17"
    image: "assets/branding/khataflow_icon.png"
    color_dark: "#0B0F17"
    image_dark: "assets/branding/khataflow_icon.png"
  android: true
  ios: true
  web: false
